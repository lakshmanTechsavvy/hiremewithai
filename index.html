<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI OfferLetter - Data Analytics Job Accelerator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f9fbfd;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 650px;
            width: 100%;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            text-align: center;
            box-sizing: border-box;
        }
        h1 {
            color: #1e3a8a;
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        h2 {
            color: #3b82f6;
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 24px;
            font-weight: 600;
        }
        p.description {
            color: #4b5563;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 32px;
            text-align: left;
        }
        .form-wrapper {
            width: 100%;
            margin-top: 20px;
        }
        iframe {
            border: none;
            width: 100%;
            min-height: 600px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Main Brand Updates -->
        <h1>AI OfferLetter</h1>
        <h2>Unlock Your Data Analytics Offer Letter</h2>
        
        <!-- Target Copywriting -->
        <p class="description">
            Stop getting rejected by ATS. Paste your resume and job description to get your exact missing keywords, custom project blueprints, and the absolute confidence you need to land your dream Data Analytics job.
        </p>

        <!-- Embedded Live Tally Form Block -->
        <div class="form-wrapper">
            <!-- Replace the src URL below with your actual shared Tally iframe code if needed -->
            <iframe src="https://tally.so" loading="lazy" title="AI OfferLetter Form"></iframe>
        </div>
    </div>

</body>
</html>
