<!-- JAVASCRIPT FOR GITHUB API -->
    <script>
      async function fetchGitHubInternships() {
        const skillInput = document.getElementById("skillInput").value.trim() || "data-analysis";
        const resultsContainer = document.getElementById("githubResults");
        resultsContainer.innerHTML = '<p class="text-sm text-slate-500 text-center py-4">Searching live GitHub open-source opportunities...</p>';

        try {
          const query = encodeURIComponent(skillInput + ' label:"good first issue" state:open');
          const response = await fetch("https://api.github.com/search/issues?q=" + query + "&per_page=6");
          
          if (!response.ok) throw new Error("API limit or network error");
          const data = await response.json();

          if (!data.items || data.items.length === 0) {
            resultsContainer.innerHTML = '<p class="text-sm text-slate-500 text-center py-4">No open beginner issues found for this keyword. Try "python", "sql", or "pandas".</p>';
            return;
          }

          resultsContainer.innerHTML = data.items.map(function (item) {
            const repoName = item.repository_url.split("/").slice(-2).join("/");
            return `
              <div class="border border-slate-200 rounded-xl p-4 bg-white text-left hover:border-terracotta transition">
                <span class="text-xs font-semibold text-teal-700 bg-teal-50 px-2.5 py-0.5 rounded-full">Beginner Friendly • Open</span>
                <h4 class="mt-2.5 mb-1.5 text-sm font-bold text-slateDark">${item.title}</h4>
                <p class="mb-3 text-xs text-slate-500">Repo: <strong>${repoName}</strong></p>
                <a href="${item.html_url}" target="_blank" rel="noopener noreferrer" class="text-xs font-semibold text-terracotta hover:underline">View Task & Contribute &rarr;</a>
              </div>
            `;
          }).join("");
        } catch (error) {
          resultsContainer.innerHTML = '<p class="text-sm text-red-500 text-center py-4">Unable to fetch live GitHub projects right now. Please try again in a minute.</p>';
        }
      }

      // Allow pressing "Enter" inside the input box
      document.getElementById("skillInput").addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
          fetchGitHubInternships();
        }
      });
    </script>
</body>
</html>
