<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HireFit AI - Fit Job Checker</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #475569;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      width: 100%;
      padding: 40px 30px;
      text-align: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 12px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: var(--text);
    }

    p.subtitle {
      font-size: 16px;
      color: var(--text-muted);
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 6px;
      color: var(--text);
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus {
      border-color: var(--primary);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    footer {
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">HireFit AI</div>
    <h1>Fit Job Checker</h1>
    <p class="subtitle">Check how well your resume matches any job description instantly using AI analysis.</p>

    <!-- Connect your Tally.so embed or form endpoint below -->
    <form id="checker-form">
      <div class="form-group">
        <label for="email">Your Email Address</label>
        <input type="email" id="email" placeholder="name@example.com" required />
      </div>

      <div class="form-group">
        <label for="job-description">Job Description</label>
        <textarea id="job-description" placeholder="Paste the job requirements or description here..." required></textarea>
      </div>

      <div class="form-group">
        <label for="resume">Your Resume Summary / Text</label>
        <textarea id="resume" placeholder="Paste your resume content or skills summary..." required></textarea>
      </div>

      <button type="submit">Analyze Job Fit</button>
    </form>
  </div>

  <footer>
    &copy; HireFit AI. All rights reserved.
  </footer>

</body>
</html>
